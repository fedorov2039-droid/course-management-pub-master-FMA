workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

stages:
  - build

build-job:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - linux
    - bas2301
  script:
    - chmod +x mvnw
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week